[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whoscored-event-data"
version = "2.0.0"
description = "Polite, typed Python SDK for scraping football event data from Whoscored's chalkboard."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ali Hasan Khan" }]
keywords = ["football", "soccer", "whoscored", "event-data", "scraping", "analytics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "lxml>=4.9",
    "tqdm>=4.60",
]

[project.optional-dependencies]
browser = ["selenium>=4.10"]
visuals = ["matplotlib>=3.5", "seaborn>=0.12", "mplsoccer>=1.2"]
dev = ["pytest>=7", "pyarrow>=12"]

[project.scripts]
whoscored = "whoscored.cli:main"

[tool.setuptools]
packages = ["whoscored"]

[tool.setuptools.package-data]
whoscored = ["data/*.json", "data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
